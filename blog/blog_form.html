{% extends "base.html" %}

{% block content %}
  {% include "partials/main_menu.html" %}

  <h1>{% if object %}Редактировать статью{% else %}Создать статью{% endif %}</h1>

  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Сохранить</button>
  </form>

  <p><a href="{% url 'blog_list' %}">Вернуться к списку</a></p>
{% endblock %}
