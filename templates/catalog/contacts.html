<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Интернет-магазин — Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container py-4">
        <h1>Контакты</h1>
        <p>Свяжитесь с нами любым удобным способом:</p>

        <ul class="list-group mb-4">
            <li class="list-group-item">Телефон: +7 (999) 000‑00‑00</li>
            <li class="list-group-item">Email: info@myshop.ru</li>
            <li class="list-group-item">Адрес: г. Москва, ул. Примерная, д. 1</li>
        </ul>

        <!-- Сюда можно добавить форму, если делаешь доп. задание -->
        <form method="post">
            {% csrf_token %}
            <label for="message" class="form-label">Ваше сообщение</label>
            <textarea name="message" id="message" class="form-control" rows="4"></textarea>
            <button type="submit" class="btn btn-primary mt-3">Отправить</button>
        </form>

        {% if success %}
            <div class="alert alert-success mt-3">Спасибо, ваше сообщение отправлено!</div>
        {% endif %}
    </div>
</body>
</html>
